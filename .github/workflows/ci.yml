name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build:web

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build:web

      - name: Build single binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA:-unknown}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$DATE" \
            -o "dist/gi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/gi

      - name: Package artifact
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "gi-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "gi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          else
            tar -czf "gi-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "gi-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          fi

      - name: Upload single-binary artifact
        uses: actions/upload-artifact@v7
        with:
          # Tag builds are temporary Release handoffs; ordinary CI output is short-lived.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 3 }}
          name: gi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish durable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Delete handoff artifacts and keep at most 10 releases
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId, per_page: 100 },
            );
            for (const artifact of currentArtifacts) {
              core.info(`Deleting Release handoff artifact ${artifact.name} (${artifact.id}).`);
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const published = releases
              .filter((release) => !release.draft)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const retained = published.slice(0, 10);
            if (retained.some((release) => !release.assets?.length)) {
              core.warning('A retained Release has no durable assets; skipping Release pruning.');
              return;
            }
            for (const release of published.slice(10)) {
              core.info(`Deleting old Release ${release.tag_name} (${release.id}).`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              if (!release.tag_name) continue;
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
