name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build:web

      - name: Pixel evidence helper tests
        run: make test-pixel-helpers test-compose-surface-helpers test-model-panel-helpers

      - name: Go test
        run: go test ./...

      - name: Shell cancellation race checks
        run: make test-shell-runtime

      - name: Active steering repeat checks
        run: make test-active-steering

      - name: Go vet
        run: go vet ./...

  passkey-browser:
    name: Native passkey browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: make test-ux-passkeys
      - name: Retain native passkey fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-passkey-browser-evidence
          path: test-results/ux-parity
          retention-days: 3

  browser-journey:
    name: Startup and Return browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install web dependencies
        run: bun install
      - name: Install Chromium and WebKit
        run: bun x playwright install --with-deps chromium webkit
      - name: Verify clean boot, new chat and first Return
        run: make test-ux-journey
      - name: Verify pinned composer and picker geometry
        run: make test-ux-picker-geometry
      - name: Verify slash and Quick Actions keyboard ownership
        run: make test-ux-slash
      - name: Verify read-only workspace tab transitions
        run: make test-ux-workspace-tabs
      - name: Verify compose surface and resize ownership
        run: make test-ux-compose-surface
      - name: Verify native model panel and Settings handoff
        run: make test-ux-model-panel
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-return-browser-evidence
          path: test-results/ux-parity
          retention-days: 3

  auth-state:
    name: Auth state ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Native auth state locking and replacement
        run: go test ./internal/auth -count=3

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [test, auth-state, passkey-browser, browser-journey]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build:web

      - name: Build single binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA:-unknown}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.date=$DATE" \
            -o "dist/gi-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/gi

      - name: Package artifact
        shell: bash
        run: |
          cd dist
          tar -czf "gi-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "gi-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Upload single-binary artifact
        uses: actions/upload-artifact@v7
        with:
          # Tag builds are temporary Release handoffs; ordinary CI output is short-lived.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 3 }}
          name: gi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish durable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Delete handoff artifacts and keep at most 10 releases
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId, per_page: 100 },
            );
            for (const artifact of currentArtifacts) {
              core.info(`Deleting Release handoff artifact ${artifact.name} (${artifact.id}).`);
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const published = releases
              .filter((release) => !release.draft)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const retained = published.slice(0, 10);
            if (retained.some((release) => !release.assets?.length)) {
              core.warning('A retained Release has no durable assets; skipping Release pruning.');
              return;
            }
            for (const release of published.slice(10)) {
              core.info(`Deleting old Release ${release.tag_name} (${release.id}).`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              if (!release.tag_name) continue;
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
